<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div id="contenedor-login">

        <form id="form-login">
            <h2>Inicio de Sesión</h2>
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="Ingrese su correo" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ingrese su contraseña" required>
            <button type="submit" id="button-session">Iniciar sesión</button>
        </form>
        <p id="toregister">No tengo cuenta</p>

    </div>

<script src="login.js"></script>
</body>
</html>
