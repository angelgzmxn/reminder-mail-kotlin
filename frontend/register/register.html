<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">

</head>
<body>
    <div id="contenedor-register">

        <form id="form-register">
            <h2>Registro</h2>
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="Ingrese un correo" required>
            <label for="fullName">Nombre y Apellido</label>
            <input type="text" id="fullName" name="fullName" autocomplete="fullName" placeholder="Ingrese un nombre completo" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" placeholder="Ingrese una contraseña" required>
            <button type="submit" id="button-register">Registrarse</button>
        </form>
        <p id="tologin"> Ya tengo cuenta  </p>
    </div>
<script src="register.js"></script>
</body>
</html>
