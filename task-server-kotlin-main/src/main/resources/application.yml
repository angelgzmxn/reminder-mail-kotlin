spring:
  application:
    name: TaskServerKotlin
  datasource:
    url: jdbc:sqlite:file:task_server_kotlin?mode=memory&cache=shared
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
