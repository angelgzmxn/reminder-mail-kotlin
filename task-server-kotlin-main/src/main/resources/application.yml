    password: rtlxzwrpwvsyrdau
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-secret-must-be-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  mail:
    from: ${MAIL_FROM:no-reply@remindermail.com}
  reminder:
    scheduler:
      fixed-delay-ms: ${REMINDER_SCHEDULER_DELAY_MS:60000}
